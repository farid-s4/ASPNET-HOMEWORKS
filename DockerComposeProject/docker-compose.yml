services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Pass1234
    ports:
      - "1433:1433"

  api:
    build:
      context: .
      dockerfile: DockerComposeAPI/DockerComposeAPI/Dockerfile
    depends_on:
      - db
    ports:
      - "5000:8080" 
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=APIDb;User Id=sa;Password=Pass1234;TrustServerCertificate=True;

  ui:
    build:
      context: ./docker-frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "3000:80" 
